name: macOS Latest Screen Sharing

on:
  workflow_dispatch:

jobs:
  workstation:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Inspect macOS Runner
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "OPERATING SYSTEM"
          echo "=================================================="
          sw_vers

          echo
          echo "=================================================="
          echo "KERNEL / ARCHITECTURE"
          echo "=================================================="
          uname -a
          uname -m

          echo
          echo "=================================================="
          echo "HARDWARE"
          echo "=================================================="
          system_profiler SPHardwareDataType

          echo
          echo "=================================================="
          echo "XCODE"
          echo "=================================================="
          xcodebuild -version || true
          xcode-select -p

          echo
          echo "=================================================="
          echo "DISK"
          echo "=================================================="
          df -h /

      - name: Select Current Xcode
        shell: bash
        run: |
          set -euxo pipefail

          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -n 1)"

          if [ -n "$XCODE_APP" ] && [ -d "$XCODE_APP/Contents/Developer" ]; then
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi

          xcodebuild -version
          xcode-select -p

      - name: Enable macOS Screen Sharing
        shell: bash
        run: |
          set -euo pipefail

          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"
          SCREENSHARING_PLIST="/System/Library/LaunchDaemons/com.apple.screensharing.plist"
          CURRENT_USER="$(stat -f '%Su' /dev/console)"

          echo "Console user: $CURRENT_USER"

          if [ "$CURRENT_USER" = "root" ] || [ -z "$CURRENT_USER" ]; then
            echo "No normal console user is available on this runner."
            exit 1
          fi

          test -f "$SCREENSHARING_PLIST"

          sudo launchctl enable system/com.apple.screensharing || true
          sudo launchctl bootstrap system "$SCREENSHARING_PLIST" 2>/dev/null || \
            sudo launchctl load -w "$SCREENSHARING_PLIST" 2>/dev/null || true

          if [ -x "$KICKSTART" ]; then
            sudo "$KICKSTART" \
              -activate \
              -configure \
              -access -on \
              -users "$CURRENT_USER" \
              -privs -all \
              -restart -agent || true
          fi

          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true

          echo
          echo "=================================================="
          echo "SCREEN SHARING"
          echo "=================================================="
          sudo launchctl print system/com.apple.screensharing 2>/dev/null | sed -n '1,80p' || true

          echo
          echo "=================================================="
          echo "VNC LISTENER"
          echo "=================================================="
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || true

      - name: Show Remote Access Information
        shell: bash
        run: |
          echo
          echo "=================================================="
          echo "macOS RUNNER"
          echo "=================================================="
          sw_vers
          echo
          echo "ARCHITECTURE:"
          uname -m
          echo
          echo "REMOTE PROTOCOL:"
          echo "macOS Screen Sharing / VNC"
          echo
          echo "LISTENER:"
          echo "TCP 5900"
          echo
          echo "AUTHENTICATION:"
          echo "Use the macOS console user's credentials."
          echo
          echo "NOTE:"
          echo "macOS does not provide a native RDP server."
          echo "This workflow does not install an RDP server, third-party RDP software,"
          echo "Tailscale, a separate remote user, or a fixed remote password."
          echo
          echo "=================================================="
