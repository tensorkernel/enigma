name: Ubuntu LXDE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # =========================================================
      # SYSTEM INFORMATION
      # =========================================================
      - name: System Information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== OS ==="
          cat /etc/os-release

          echo
          echo "=== KERNEL ==="
          uname -a

          echo
          echo "=== CPU ==="
          nproc

          echo
          echo "=== MEMORY ==="
          free -h

          echo
          echo "=== DISK ==="
          df -h /

      # =========================================================
      # INSTALL LXDE + XRDP
      # =========================================================
      - name: Install LXDE and xRDP
        shell: bash
        run: |
          set -euxo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            lxde-core \
            openbox-lxde-session \
            lxsession \
            lxpanel \
            pcmanfm \
            lxterminal \
            lxappearance \
            lxpolkit \
            openbox \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-user-session \
            xauth \
            x11-xserver-utils \
            curl \
            ca-certificates \
            netcat-openbsd \
            ufw

          sudo apt-get install -f -y

          echo
          echo "=== XRDP VERSION ==="
          xrdp --version || true

          echo
          echo "=== LXSESSION ==="
          lxsession --version || true

          echo
          echo "=== X11 SESSIONS ==="
          ls -la /usr/share/xsessions/

      # =========================================================
      # CREATE RDP USER
      # =========================================================
      - name: Create RDP User
        shell: bash
        run: |
          set -euo pipefail

          USERNAME="RDP"
          PASSWORD="admin"

          if ! id "$USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          # Set requested fixed password.
          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          # Give the RDP account sudo/admin access.
          sudo usermod -aG sudo "$USERNAME"

          # Allow xrdp to access its certificate.
          sudo usermod -aG ssl-cert xrdp

          # Make absolutely sure the home directory is owned correctly.
          sudo mkdir -p "/home/$USERNAME"
          sudo chown -R "$USERNAME:$USERNAME" "/home/$USERNAME"

          echo "RDP_USER=$USERNAME" >> "$GITHUB_ENV"
          echo "RDP_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

          echo
          echo "RDP user created."
          echo "Username: $USERNAME"

      # =========================================================
      # CONFIGURE LXDE SESSION
      # =========================================================
      - name: Configure LXDE Session
        shell: bash
        run: |
          set -euo pipefail

          USERNAME="RDP"
          HOME_DIR="/home/$USERNAME"

          # Create a clean X11/LXDE session.
          sudo -u "$USERNAME" tee "$HOME_DIR/.xsession" >/dev/null <<'EOF'
          #!/bin/sh

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=LXDE
          export XDG_SESSION_DESKTOP=LXDE

          export XDG_CONFIG_DIRS="/etc/xdg"
          export XDG_DATA_DIRS="/usr/local/share:/usr/share"

          unset WAYLAND_DISPLAY
          unset DBUS_SESSION_BUS_ADDRESS

          exec dbus-run-session -- lxsession -s LXDE -e LXDE
          EOF

          sudo chmod 755 "$HOME_DIR/.xsession"
          sudo chown "$USERNAME:$USERNAME" "$HOME_DIR/.xsession"

          # Make sure LXDE uses X11 and not Wayland.
          sudo -u "$USERNAME" tee "$HOME_DIR/.profile" >/dev/null <<'EOF'
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=LXDE
          export XDG_SESSION_DESKTOP=LXDE
          export GDK_BACKEND=x11
          export QT_X11_NO_MITSHM=1

          unset WAYLAND_DISPLAY
          unset DBUS_SESSION_BUS_ADDRESS
          EOF

          sudo chown "$USERNAME:$USERNAME" "$HOME_DIR/.profile"

          echo
          echo "=== USER SESSION ==="
          sudo cat "$HOME_DIR/.xsession"

          echo
          echo "=== USER PROFILE ==="
          sudo cat "$HOME_DIR/.profile"

      # =========================================================
      # CONFIGURE XRDP
      # =========================================================
      - name: Configure xRDP
        shell: bash
        run: |
          set -euo pipefail

          # Backup packaged Ubuntu startup script.
          if [ -f /etc/xrdp/startwm.sh ]; then
            sudo cp \
              /etc/xrdp/startwm.sh \
              /etc/xrdp/startwm.sh.backup
          fi

          # Keep xrdp's normal Ubuntu/Xsession flow.
          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh

          if test -r /etc/profile; then
              . /etc/profile
          fi

          if test -r /etc/default/locale; then
              . /etc/default/locale
              export LANG LANGUAGE
          fi

          unset WAYLAND_DISPLAY
          unset DBUS_SESSION_BUS_ADDRESS

          exec /etc/X11/Xsession
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

          # Ensure xrdp has access to its TLS key/certificate.
          sudo usermod -aG ssl-cert xrdp

          echo
          echo "=== XRDP START SCRIPT ==="
          sudo cat /etc/xrdp/startwm.sh

          echo
          echo "=== XRDP CONFIG ==="
          sudo grep -E \
            '^(port|address|security_layer|crypt_level)=' \
            /etc/xrdp/xrdp.ini || true

      # =========================================================
      # INSTALL TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          echo
          echo "=== TAILSCALE VERSION ==="
          tailscale version

      # =========================================================
      # CONNECT TAILSCALE
      # =========================================================
      - name: Connect Tailscale
        shell: bash
        run: |
          set -euxo pipefail

          HOSTNAME="gh-lxde-rdp-${GITHUB_RUN_ID}"

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="$HOSTNAME"

          echo
          echo "=== TAILSCALE STATUS ==="
          sudo tailscale status

          TS_IP=""

          for i in $(seq 1 30); do
            TS_IP="$(sudo tailscale ip -4 | head -n1 | tr -d '\r\n' || true)"

            if [ -n "$TS_IP" ]; then
              break
            fi

            echo "Waiting for Tailscale IP... ($i/30)"
            sleep 2
          done

          if [ -z "$TS_IP" ]; then
            echo
            echo "ERROR: Tailscale IPv4 address was not assigned."
            sudo tailscale status
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo
          echo "Tailscale IPv4: $TS_IP"

      # =========================================================
      # FIREWALL
      # =========================================================
      - name: Configure Firewall
        shell: bash
        run: |
          set -euxo pipefail

          # Deny unsolicited traffic by default.
          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # RDP ONLY through Tailscale.
          sudo ufw allow in on tailscale0 \
            to any port 3389 \
            proto tcp

          sudo ufw --force enable

          echo
          echo "=== FIREWALL ==="
          sudo ufw status verbose

      # =========================================================
      # START XRDP
      # =========================================================
      - name: Start xRDP
        shell: bash
        run: |
          set -euxo pipefail

          sudo systemctl daemon-reload

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 3

          echo
          echo "=== XRDP SERVICE ==="
          sudo systemctl --no-pager --full status xrdp

          echo
          echo "=== XRDP SESMAN ==="
          sudo systemctl --no-pager --full status xrdp-sesman

      # =========================================================
      # VERIFY SERVER BEFORE DISPLAYING CONNECTION DETAILS
      # =========================================================
      - name: Verify RDP
        shell: bash
        run: |
          set -euo pipefail

          echo "=== LISTENING ON 3389 ==="
          sudo ss -lntp | grep ':3389'

          echo
          echo "=== XRDP SERVICE ==="
          sudo systemctl is-active xrdp
          sudo systemctl is-active xrdp-sesman

          echo
          echo "=== TAILSCALE ==="
          sudo tailscale status

          echo
          echo "=== TAILSCALE INTERFACE ==="
          ip addr show tailscale0

          echo
          echo "=== FIREWALL ==="
          sudo ufw status verbose

          echo
          echo "=== X11 SESSIONS ==="
          ls -la /usr/share/xsessions/

          echo
          echo "=== RDP USER ==="
          id "$RDP_USER"

          echo
          echo "=== SESSION FILE ==="
          sudo cat "/home/$RDP_USER/.xsession"

          echo
          echo "=== TCP TEST ==="
          nc -vz -w 5 "$TAILSCALE_IP" 3389

          echo
          echo "=== XRDP LOG ==="
          sudo tail -n 80 /var/log/xrdp.log || true

          echo
          echo "=== XRDP SESMAN LOG ==="
          sudo tail -n 120 /var/log/xrdp-sesman.log || true

          echo
          echo "=========================================="
          echo "RDP SERVER VERIFIED"
          echo "=========================================="

      # =========================================================
      # CONNECTION DETAILS
      # =========================================================
      - name: Show RDP Access
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "              UBUNTU LXDE RDP"
          echo "================================================"
          echo
          echo "Host:"
          echo "$TAILSCALE_IP:3389"
          echo
          echo "Username:"
          echo "RDP"
          echo
          echo "Password:"
          echo "admin"
          echo
          echo "Desktop:"
          echo "LXDE"
          echo
          echo "Window Manager:"
          echo "Openbox"
          echo
          echo "Display:"
          echo "Xorg / xorgxrdp"
          echo
          echo "Network:"
          echo "Tailscale only"
          echo
          echo "================================================"
          echo "Connect using:"
          echo "$TAILSCALE_IP:3389"
          echo "================================================"

      # =========================================================
      # KEEP RUNNER ALIVE
      # =========================================================
      - name: Keep RDP Alive
        shell: bash
        run: |
          set -u

          echo
          echo "RDP SESSION ACTIVE"
          echo "Runner maximum duration: 360 minutes."
          echo

          while true; do

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RDP active"

            # Automatically restart xrdp if the service dies.
            if ! sudo systemctl is-active --quiet xrdp; then

              echo "WARNING: xrdp stopped."
              echo "Attempting restart..."

              sudo systemctl restart xrdp || true

              echo
              echo "=== XRDP STATUS ==="
              sudo systemctl --no-pager status xrdp || true

              echo
              echo "=== XRDP LOG ==="
              sudo tail -n 100 /var/log/xrdp.log || true

              echo
              echo "=== SESMAN LOG ==="
              sudo tail -n 150 /var/log/xrdp-sesman.log || true
            fi

            sleep 30
          done
