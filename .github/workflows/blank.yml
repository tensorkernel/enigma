 name: Install Tailscale ARM64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.8-arm64.msi"
          $installerPath = "$env:TEMP\tailscale-arm64.msi"
          $logPath = "$env:TEMP\tailscale-install.log"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart", "/L*v", "`"$logPath`"" `
            -Wait

          Remove-Item $installerPath -Force

          Write-Host "Tailscale install log:"
          Get-Content $logPath -Tail 80

          Get-Service Tailscale* | Format-Table -AutoSize

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not "${{ secrets.TAILSCALE_AUTH_KEY }}") {
              Write-Error "TAILSCALE_AUTH_KEY secret is empty or missing"
              exit 1
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              $tailscale = "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          }

          if (-not (Test-Path $tailscale)) {
              Write-Error "tailscale.exe not found"
              exit 1
          }

          Write-Host "Using Tailscale binary: $tailscale"

          $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          if ($svc) {
              Start-Service Tailscale -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
          }

          & $tailscale version

          & $tailscale up `
            --auth-key="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-arm64-runner-$env:GITHUB_RUN_ID" `
            --unattended=true `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              Write-Error "tailscale up failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {
              Write-Host "Waiting for Tailscale IP... attempt $i/30"

              & $tailscale status

              $tsIP = (& $tailscale ip -4) | Select-Object -First 1

              if ($tsIP) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              Write-Host "Final Tailscale status:"
              & $tailscale status
              Write-Error "Tailscale IP not assigned. Check auth key, ACL/tag permissions, and install logs."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP assigned: $tsIP"
