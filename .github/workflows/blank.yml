```yaml
name: Ubuntu XFCE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: System info
        shell: bash
        run: |
          set -eux
          echo "=== OS ==="
          cat /etc/os-release
          echo
          echo "=== CPU ==="
          nproc
          echo
          echo "=== MEMORY ==="
          free -h
          echo
          echo "=== DISK ==="
          df -h /

      - name: Install XFCE and xrdp
        shell: bash
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-user-session \
            xauth \
            curl \
            ca-certificates \
            netcat-openbsd

          sudo apt-get install -f -y

          echo
          echo "=== XRDP VERSION ==="
          xrdp --version || true

          echo
          echo "=== XFCE ==="
          xfce4-session --version || true

      - name: Create RDP user
        shell: bash
        run: |
          set -eux

          USERNAME="RDP"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User already exists"
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          PASSWORD="$(
            python3 <<'PY'
          import secrets
          import string

          upper = string.ascii_uppercase
          lower = string.ascii_lowercase
          digits = string.digits
          special = "!@#$%^&*_-+=?"

          chars = [
              secrets.choice(upper) for _ in range(4)
          ] + [
              secrets.choice(lower) for _ in range(4)
          ] + [
              secrets.choice(digits) for _ in range(4)
          ] + [
              secrets.choice(special) for _ in range(4)
          ]

          alphabet = upper + lower + digits + special

          while len(chars) < 24:
              chars.append(secrets.choice(alphabet))

          secrets.SystemRandom().shuffle(chars)
          print("".join(chars))
          PY
          )"

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          # sudo access
          sudo usermod -aG sudo "$USERNAME"

          # xrdp certificate permissions
          sudo usermod -aG ssl-cert xrdp

          {
            echo "RDP_USER=$USERNAME"
            echo "RDP_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

          echo "RDP account created."

      - name: Configure XFCE session
        shell: bash
        run: |
          set -eux

          USERNAME="RDP"
          HOME_DIR="/home/$USERNAME"

          # Start an XFCE session for the RDP user.
          sudo -u "$USERNAME" bash -c 'printf "%s\n" "startxfce4" > "$HOME/.xsession"'
          sudo chmod 755 "$HOME_DIR/.xsession"

          # Clean environment that commonly causes session problems.
          sudo -u "$USERNAME" bash -c '
            cat > "$HOME/.profile" <<EOF
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export GDK_BACKEND=x11
          export QT_X11_NO_MITSHM=1
          unset WAYLAND_DISPLAY
          unset DBUS_SESSION_BUS_ADDRESS
          EOF
          '

          # Use the normal Ubuntu/Xsession mechanism and explicitly
          # select XFCE.
          sudo cp /etc/xrdp/startwm.sh /etc/xrdp/startwm.sh.orig

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset WAYLAND_DISPLAY

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          exec startxfce4
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

          echo
          echo "=== /etc/xrdp/startwm.sh ==="
          sudo cat /etc/xrdp/startwm.sh

          echo
          echo "=== RDP USER .xsession ==="
          sudo cat "$HOME_DIR/.xsession"

      - name: Install Tailscale
        shell: bash
        run: |
          set -eux

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          tailscale version

      - name: Connect to Tailscale
        shell: bash
        run: |
          set -eux

          HOSTNAME="gh-xfce-rdp-${GITHUB_RUN_ID}"

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="$HOSTNAME"

          echo
          echo "=== TAILSCALE STATUS ==="
          sudo tailscale status

          TS_IP=""

          for i in $(seq 1 30); do
            TS_IP="$(sudo tailscale ip -4 | head -n1 || true)"

            if [ -n "$TS_IP" ]; then
              break
            fi

            echo "Waiting for Tailscale IP..."
            sleep 2
          done

          if [ -z "$TS_IP" ]; then
            echo "ERROR: No Tailscale IPv4 address."
            sudo tailscale status
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo
          echo "Tailscale IP: $TS_IP"

      - name: Configure firewall
        shell: bash
        run: |
          set -eux

          sudo apt-get install -y ufw

          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # RDP only through the Tailscale interface.
          sudo ufw allow in on tailscale0 \
            to any port 3389 \
            proto tcp

          sudo ufw --force enable

          echo
          echo "=== FIREWALL ==="
          sudo ufw status verbose

      - name: Start xrdp
        shell: bash
        run: |
          set -eux

          sudo systemctl daemon-reload

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 3

          echo
          echo "=== XRDP ==="
          sudo systemctl --no-pager --full status xrdp

          echo
          echo "=== XRDP-SESMAN ==="
          sudo systemctl --no-pager --full status xrdp-sesman

      - name: Verify RDP
        shell: bash
        run: |
          set -eux

          echo "=== LISTENING PORT ==="
          sudo ss -lntp | grep ':3389'

          echo
          echo "=== XRDP STATUS ==="
          sudo systemctl is-active xrdp
          sudo systemctl is-active xrdp-sesman

          echo
          echo "=== XRDP LOG ==="
          sudo tail -n 80 /var/log/xrdp.log || true

          echo
          echo "=== SESMAN LOG ==="
          sudo tail -n 120 /var/log/xrdp-sesman.log || true

          echo
          echo "=== TAILSCALE ==="
          sudo tailscale status

          echo
          echo "=== TCP TEST ==="
          nc -vz -w 5 "$TAILSCALE_IP" 3389

          echo
          echo "RDP server is ready."

      - name: Show connection details
        shell: bash
        run: |
          echo
          echo "================================================"
          echo "              UBUNTU XFCE RDP"
          echo "================================================"
          echo
          echo "Host:"
          echo "$TAILSCALE_IP:3389"
          echo
          echo "Username:"
          echo "$RDP_USER"
          echo
          echo "Password:"
          echo "$RDP_PASSWORD"
          echo
          echo "Desktop:"
          echo "XFCE"
          echo
          echo "Backend:"
          echo "Xorg / xorgxrdp"
          echo
          echo "Network:"
          echo "Tailscale only"
          echo
          echo "================================================"

      - name: Keep runner alive
        shell: bash
        run: |
          set -u

          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RDP active"

            if ! sudo systemctl is-active --quiet xrdp; then
              echo "xrdp stopped, attempting restart..."

              sudo systemctl restart xrdp || true

              echo
              echo "=== XRDP LOG ==="
              sudo tail -n 100 /var/log/xrdp.log || true

              echo
              echo "=== SESMAN LOG ==="
              sudo tail -n 150 /var/log/xrdp-sesman.log || true
            fi

            sleep 30
          done
```
