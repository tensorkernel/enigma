name: Ubuntu SSH

on:
  workflow_dispatch:

jobs:
  ubuntu-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install SSH Server
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y openssh-server

          sudo systemctl enable ssh
          sudo systemctl start ssh

      - name: Create SSH User
        run: |
          set -e

          USERNAME="ubuntu"

          if id "$USERNAME" >/dev/null 2>&1; then
            echo "User $USERNAME already exists"
          else
            sudo useradd -m -s /bin/bash "$USERNAME"
          fi

          sudo usermod -aG sudo "$USERNAME"

          PASSWORD="$(openssl rand -base64 24)"
          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          sudo sed -i 's/^#*PasswordAuthentication .*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PermitRootLogin .*/PermitRootLogin no/' /etc/ssh/sshd_config
          sudo sed -i 's/^#*PubkeyAuthentication .*/PubkeyAuthentication yes/' /etc/ssh/sshd_config

          sudo systemctl restart ssh

          echo "SSH_USERNAME=$USERNAME" >> "$GITHUB_ENV"
          echo "SSH_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"

      - name: Install Tailscale
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          if [ -z "$TS_AUTHKEY" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing"
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname="gh-ubuntu-runner-${GITHUB_RUN_ID}" \
            --accept-dns=false

          TS_IP=""

          for i in $(seq 1 40); do
            TS_IP="$(tailscale ip -4 | head -n 1 || true)"

            if [ -n "$TS_IP" ]; then
              break
            fi

            echo "Waiting for Tailscale IP... attempt $i/40"
            sleep 5
          done

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned"
            tailscale status || true
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Verify SSH
        run: |
          set -e

          sudo systemctl status ssh --no-pager
          ss -tlnp | grep ':22'

          echo "SSH is listening on port 22"

      - name: Maintain SSH Connection
        run: |
          echo ""
          echo "=== UBUNTU SSH ACCESS ==="
          echo "Address: $TAILSCALE_IP"
          echo "Username: $SSH_USERNAME"
          echo "Password: $SSH_PASSWORD"
          echo ""
          echo "Connect:"
          echo "ssh $SSH_USERNAME@$TAILSCALE_IP"
          echo "========================="
          echo ""

          while true; do
            echo "[$(date)] SSH active. Cancel workflow to terminate."
            sleep 300
          done
