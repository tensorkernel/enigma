name: RDP ARM64

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null

          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) + [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_USERNAME=RDP" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Tailscale ARM64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.8-arm64.msi"
          $installerPath = "$env:TEMP\tailscale-arm64.msi"
          $logPath = "$env:TEMP\tailscale-install.log"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart", "/L*v", "`"$logPath`"" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0 -and $process.ExitCode -ne 3010) {
              Get-Content $logPath -Tail 120
              Write-Error "Tailscale MSI install failed with exit code $($process.ExitCode)"
              exit $process.ExitCode
          }

          Remove-Item $installerPath -Force

          Write-Host "Tailscale install completed."
          Get-Service Tailscale* | Format-Table -AutoSize

      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Error "TAILSCALE_AUTH_KEY secret is empty or missing."
              exit 1
          }

          $tailscalePaths = @(
              "$env:ProgramFiles\Tailscale\tailscale.exe",
              "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          )

          $tailscale = $tailscalePaths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $tailscale) {
              Write-Error "tailscale.exe not found after install."
              exit 1
          }

          Write-Host "Using Tailscale binary: $tailscale"

          Start-Service Tailscale -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8

          & $tailscale version

          $hostname = "gh-arm64-runner-$env:GITHUB_RUN_ID"

          & $tailscale up `
            "--auth-key=$env:TS_AUTHKEY" `
            "--hostname=$hostname" `
            "--unattended=true" `
            "--accept-dns=false"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "tailscale up failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
          }

          $tsIP = $null

          for ($i = 1; $i -le 40; $i++) {
              Write-Host "Waiting for Tailscale IPv4 address... attempt $i/40"

              $tsIP = (& $tailscale ip -4 2>$null) | Select-Object -First 1

              if (-not [string]::IsNullOrWhiteSpace($tsIP)) {
                  break
              }

              Start-Sleep -Seconds 5
          }

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
              Write-Host "Final Tailscale status:"
              & $tailscale status
              Write-Error "Tailscale IP not assigned. Check auth key expiry, reusable/pre-approved settings, and tailnet device approval."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Tailscale IPv4: $tsIP"

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "RDP TCP connectivity successful."

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ARM64 ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "========================"
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP active. Cancel workflow to terminate."
              Start-Sleep -Seconds 300
          }
