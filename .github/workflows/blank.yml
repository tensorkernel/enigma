name: Ubuntu LXDE RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      # ---------------------------------------------------------
      # SYSTEM
      # ---------------------------------------------------------
      - name: System Information
        shell: bash
        run: |
          set -euxo pipefail

          cat /etc/os-release
          echo
          uname -a
          echo
          nproc
          free -h
          df -h /

      # ---------------------------------------------------------
      # INSTALL LIGHTWEIGHT DESKTOP + XRDP
      # ---------------------------------------------------------
      - name: Install LXDE and xRDP
        shell: bash
        run: |
          set -euxo pipefail

          export DEBIAN_FRONTEND=noninteractive

          sudo apt-get update

          sudo apt-get install -y \
            lxde-core \
            openbox-lxde-session \
            lxsession \
            lxpanel \
            pcmanfm \
            lxterminal \
            lxappearance \
            lxpolkit \
            openbox \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            dbus-user-session \
            xauth \
            x11-xserver-utils \
            curl \
            ca-certificates \
            netcat-openbsd \
            ufw

          sudo apt-get install -f -y

          echo
          echo "=== XRDP ==="
          xrdp --version || true

          echo
          echo "=== LXSESSION ==="
          lxsession --version || true

          echo
          echo "=== LXDE SESSION FILES ==="
          ls -la /usr/share/xsessions/

      # ---------------------------------------------------------
      # CREATE USER
      # ---------------------------------------------------------
      - name: Create RDP User
        shell: bash
        run: |
          set -euxo pipefail

          USERNAME="RDP"

          if ! id "$USERNAME" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$USERNAME"
          fi

          PASSWORD="$(
            python3 <<'PY'
          import secrets
          import string

          chars = []

          chars += [secrets.choice(string.ascii_uppercase) for _ in range(4)]
          chars += [secrets.choice(string.ascii_lowercase) for _ in range(4)]
          chars += [secrets.choice(string.digits) for _ in range(4)]
          chars += [secrets.choice("!@#$%^&*_-+=?") for _ in range(4)]

          alphabet = (
              string.ascii_uppercase +
              string.ascii_lowercase +
              string.digits +
              "!@#$%^&*_-+=?"
          )

          while len(chars) < 24:
              chars.append(secrets.choice(alphabet))

          secrets.SystemRandom().shuffle(chars)

          print("".join(chars))
          PY
          )"

          echo "$USERNAME:$PASSWORD" | sudo chpasswd

          # Give the RDP user sudo access.
          sudo usermod -aG sudo "$USERNAME"

          # xrdp needs access to its certificate.
          sudo usermod -aG ssl-cert xrdp

          {
            echo "RDP_USER=$USERNAME"
            echo "RDP_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"

          echo "RDP user ready."

      # ---------------------------------------------------------
      # LXDE SESSION
      # ---------------------------------------------------------
      - name: Configure LXDE Session
        shell: bash
        run: |
          set -euxo pipefail

          USERNAME="RDP"
          HOME_DIR="/home/$USERNAME"

          sudo mkdir -p "$HOME_DIR"

          # Force a clean X11/LXDE session.
          sudo -u "$USERNAME" tee "$HOME_DIR/.xsession" >/dev/null <<'EOF'
          #!/bin/sh

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=LXDE
          export XDG_SESSION_DESKTOP=LXDE

          # Ubuntu's xrdp/X11 session should use /etc/xdg.
          export XDG_CONFIG_DIRS="/etc/xdg:/etc/xdg/xdg-LXDE"
          export XDG_DATA_DIRS="/usr/local/share:/usr/share"

          unset WAYLAND_DISPLAY
          unset DBUS_SESSION_BUS_ADDRESS

          exec dbus-run-session -- lxsession -s LXDE -e LXDE
          EOF

          sudo chmod 755 "$HOME_DIR/.xsession"

          sudo chown "$USERNAME:$USERNAME" \
            "$HOME_DIR/.xsession"

          # Clean user cache/session state from previous attempts.
          sudo -u "$USERNAME" rm -rf \
            "$HOME_DIR/.cache/sessions" \
            "$HOME_DIR/.cache/xfce4" \
            "$HOME_DIR/.config/xfce4" \
            || true

          echo
          echo "=== .xsession ==="
          sudo cat "$HOME_DIR/.xsession"

      # ---------------------------------------------------------
      # KEEP UBUNTU'S NORMAL XRDP STARTUP
      # ---------------------------------------------------------
      - name: Configure xRDP Startup
        shell: bash
        run: |
          set -euxo pipefail

          # Back up the packaged script.
          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.github-backup

          # Use the standard Ubuntu/X11 session path.
          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh

          if test -r /etc/profile; then
              . /etc/profile
          fi

          if test -r /etc/default/locale; then
              . /etc/default/locale
              export LANG LANGUAGE
          fi

          # Let Ubuntu Xsession load the user's .xsession.
          if test -x /etc/X11/Xsession; then
              exec /etc/X11/Xsession
          fi

          exec /bin/sh /etc/X11/Xsession
          EOF

          sudo chmod 755 /etc/xrdp/startwm.sh

          echo
          echo "=== XRDP START SCRIPT ==="
          sudo cat /etc/xrdp/startwm.sh

      # ---------------------------------------------------------
      # TAILSCALE
      # ---------------------------------------------------------
      - name: Install Tailscale
        shell: bash
        run: |
          set -euxo pipefail

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          tailscale version

      - name: Connect Tailscale
        shell: bash
        run: |
          set -euxo pipefail

          HOSTNAME="gh-lxde-rdp-${GITHUB_RUN_ID}"

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="$HOSTNAME"

          TS_IP=""

          for i in $(seq 1 30); do
            TS_IP="$(sudo tailscale ip -4 | head -n1 || true)"

            if [ -n "$TS_IP" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$TS_IP" ]; then
            echo "No Tailscale IPv4 address."
            sudo tailscale status
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo
          echo "Tailscale IP: $TS_IP"

      # ---------------------------------------------------------
      # FIREWALL
      # ---------------------------------------------------------
      - name: Configure Firewall
        shell: bash
        run: |
          set -euxo pipefail

          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # RDP only via Tailscale.
          sudo ufw allow in on tailscale0 \
            to any port 3389 \
            proto tcp

          sudo ufw --force enable

          sudo ufw status verbose

      # ---------------------------------------------------------
      # START XRDP
      # ---------------------------------------------------------
      - name: Start xRDP
        shell: bash
        run: |
          set -euxo pipefail

          sudo systemctl daemon-reload

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 3

          echo
          echo "=== XRDP ==="
          sudo systemctl --no-pager --full status xrdp

          echo
          echo "=== XRDP SESMAN ==="
          sudo systemctl --no-pager --full status xrdp-sesman

      # ---------------------------------------------------------
      # PRE-CONNECTION CHECK
      # ---------------------------------------------------------
      - name: Verify RDP
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== PORT 3389 ==="
          sudo ss -lntp | grep ':3389'

          echo
          echo "=== XRDP SERVICE ==="
          sudo systemctl is-active xrdp
          sudo systemctl is-active xrdp-sesman

          echo
          echo "=== TAILSCALE ==="
          sudo tailscale status

          echo
          echo "=== FIREWALL ==="
          sudo ufw status verbose

          echo
          echo "=== X11 SESSIONS ==="
          ls -la /usr/share/xsessions/

          echo
          echo "=== RDP USER ==="
          id "$RDP_USER"

          echo
          echo "=== USER SESSION ==="
          sudo -u "$RDP_USER" cat "/home/$RDP_USER/.xsession"

          echo
          echo "=== TCP TEST ==="
          nc -vz -w 5 "$TAILSCALE_IP" 3389

      # ---------------------------------------------------------
      # CONNECTION INFORMATION
      # ---------------------------------------------------------
      - name: Show RDP Credentials
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo "              UBUNTU LXDE RDP"
          echo "=============================================="
          echo
          echo "Host:"
          echo "$TAILSCALE_IP:3389"
          echo
          echo "Username:"
          echo "$RDP_USER"
          echo
          echo "Password:"
          echo "$RDP_PASSWORD"
          echo
          echo "Desktop:"
          echo "LXDE / Openbox"
          echo
          echo "Display:"
          echo "Xorg / xorgxrdp"
          echo
          echo "Network:"
          echo "Tailscale"
          echo
          echo "=============================================="

      # ---------------------------------------------------------
      # KEEP RUNNER ALIVE
      # ---------------------------------------------------------
      - name: Keep RDP Alive
        shell: bash
        run: |
          while true; do

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RDP active"

            if ! sudo systemctl is-active --quiet xrdp; then

              echo "xrdp stopped. Restarting..."

              sudo systemctl restart xrdp || true

              echo
              echo "=== XRDP LOG ==="
              sudo tail -n 100 /var/log/xrdp.log || true

              echo
              echo "=== SESMAN LOG ==="
              sudo tail -n 150 /var/log/xrdp-sesman.log || true
            fi

            sleep 30
          done
